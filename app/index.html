<!DOCTYPE html>
<html>
<head>
  <title>Hello Kubernetes!</title>
  <style>
    body { background:#222; color:#eee; font-family:Ubuntu,Arial,sans-serif; margin:0; }
    .main { text-align:center; padding-top:40px; }
    .logo { width:120px; }
    .header { font-size:2em; font-weight:300; margin:30px 0 20px 0; }
    .info { background:#333; margin:30px auto 0 auto; border-radius:8px;
            width:400px; padding:30px; box-shadow:0 2px 8px #0006; }
    .info th { text-align:right; padding-right:20px; font-weight:400; }
    .info td { text-align:left; font-family:monospace; }
  </style>
</head>
<body>
  <div class="main">
    <img class="logo" src="https://raw.githubusercontent.com/kubernetes/kubernetes/master/logo/logo.png" alt="Kubernetes">
    <div class="header">Hello from __APP__.</div>
    <div class="info">
      <table>
        <tr><th>pod:</th><td>__POD__</td></tr>
        <tr><th>version:</th><td>__VERSION__</td></tr>
      </table>
    </div>
  </div>
</body>
</html>
